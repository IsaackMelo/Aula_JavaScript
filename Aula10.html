<!DOCTYPE html>
<html>
    <head>
        <title>Meu JS</title>
    </head>
    <body>

        <div class="mauricio">
            <input id='n1';> <br> <br> <input id='n2'>  
            <p id='resultado'></p>

            <button onclick='somar()'>Somar</button>
            <button onclick='Subtrair()'>Subtrair</button> 
            <button onclick='Multiplicar()'>Multiplicar</button> 
            <button onclick='Dividir()'>Dividir</button> 
        </div>

        <script> 

        function validacao() {
            let inputN1 = document.querySelector("#n1");
            let inputN2 = document.querySelector("#n2");

            if (inputN1.value.trim() === "" || inputN2.value.trim() === "") {
            alert("resenha67");
            return false;
            }
            return true;
        }

        function somar() { 
        
        if (!validacao()) return;

        let a = parseFloat(document.getElementById('n1').value); 
        let b = parseFloat(document.getElementById('n2').value); 
        document.getElementById('resultado').textContent = a + b; 
        } 

        function Subtrair() { 

        if (!validacao()) return;
    
        let a = parseFloat(document.getElementById('n1').value); 
        let b = parseFloat(document.getElementById('n2').value); 
        document.getElementById('resultado').textContent = a - b; 
        } 

        function Multiplicar() {
            
        if (!validacao()) return;

        let a = parseFloat(document.getElementById('n1').value); 
        let b = parseFloat(document.getElementById('n2').value); 
        document.getElementById('resultado').textContent = a * b; 
        } 

        function Dividir() { 

        if (!validacao()) return;
        
        let a = parseFloat(document.getElementById('n1').value); 
        let b = parseFloat(document.getElementById('n2').value); 
        document.getElementById('resultado').textContent = a / b; 
        }

        </script> 

        <style>
            html, body{
                margin: 0;
                padding: 0;    
                height: 100%;
                width: 98%;
                align-items: center;
                justify-content: center;
                display: flex;
                background-color: #f0f0f0;
            }
            .mauricio{
                border: 3px black solid;
                border-radius: 20px;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 20px;
 
            }
        </style>
    </body>
</html>
