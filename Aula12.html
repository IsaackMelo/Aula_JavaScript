<!DOCTYPE html>
<html>
    <head>
        <title>Meu JS</title>
    </head>
    <body>
        <script>
            function saudacao(){
                    return function(nome){
                        console.log("olá, " + nome + "!");
                };
            }

            let ola = saudacao();
            ola("Resenhuda");
            

            function multiplicador(x){
                    return function(a){
                        return x * a;
                };
            }

            let multiplicar = multiplicador(2);
            console.log((multiplicar(2)));

            /*3. Explique com suas palavras o que é um closure e por que ele é útil.
                São funções que acessam variáveis externas mesmo depois 
                que o escopo em que foram criadas foi encerrado. Pode ser util para criação de funções
                diversificadas, usando variaveis das funções em que foram criadas.
            */

            /* 4. Qual será o resultado do código abaixo? */
            function criarContador() { 
                let i = 0; 
                    return function() { 
                        return ++i; 
                    } 
            } 
            let c1 = criarContador(); 
            let c2 = criarContador(); 
            console.log(c1()); // 1 
            console.log(c1()); // 2 
            console.log(c2()); // 1 

        </script>
    </body>
</html>
